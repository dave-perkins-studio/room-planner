<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved to Chalk</title>
<link rel="canonical" href="https://dave-perkins-studio.github.io/chalk/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://dave-perkins-studio.github.io/chalk/">
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#F7F2E9;color:#2B251C;
    font-family:"Inclusive Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:17px;line-height:1.5;padding:24px}
  main{max-width:34ch}
  h1{font-family:Petrona,Georgia,"Times New Roman",serif;font-weight:600;
    font-size:28px;line-height:1.2;margin:0 0 12px}
  p{margin:0 0 16px;color:#64594B}
  a{color:#495C7C}
  a.go{display:inline-block;text-decoration:none;color:#495C7C;background:#F7F2E9;
    border:1px solid rgba(107,90,68,.40);box-shadow:0 2px 0 #2F3D55;
    padding:13px 16px;font-weight:500;letter-spacing:.02em}
  a.go:focus-visible{outline:3px solid transparent;color:#0b0c0c;
    background:#ffdd00;box-shadow:0 3px 0 #0b0c0c}
  @media (prefers-color-scheme: dark){
    body{background:#221E18;color:#F1E9D9}
    p{color:#B8AC98}
    a,a.go{color:#93A6C4}
    a.go{background:#221E18;border-color:rgba(200,180,150,.35)}
  }
</style>
</head>
<body>
  <main>
    <h1>The room planner is now called Chalk</h1>
    <p>Same tool, new address. You should be sent there automatically.</p>
    <p><a class="go" href="https://dave-perkins-studio.github.io/chalk/">Go to Chalk</a></p>
  </main>
  <script>
    // Carry any room or state in the fragment across with them.
    location.replace("https://dave-perkins-studio.github.io/chalk/" + location.search + location.hash);
  </script>
</body>
</html>
